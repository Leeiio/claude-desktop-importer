[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-desktop-importer"
dynamic = ["version"]
description = "Bring Claude Code CLI sessions into the Claude Desktop sidebar, with real titles and the right order."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Leeiio"}]
keywords = ["claude", "claude-code", "claude-desktop", "sessions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Leeiio/claude-desktop-importer"
Issues = "https://github.com/Leeiio/claude-desktop-importer/issues"

[project.scripts]
claude-desktop-importer = "claude_desktop_importer.cli:main"

[tool.setuptools]
packages = ["claude_desktop_importer"]

[tool.setuptools.dynamic]
version = {attr = "claude_desktop_importer.__version__"}
